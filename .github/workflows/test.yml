name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # macOS runner: the harness is macOS-centric (SwiftBar/launchd/osascript/iTerm)
    # and the installer tests exercise mac-guarded shell paths.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest pyyaml
      - name: Run test suite
        run: python -m pytest -q
