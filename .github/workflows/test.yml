name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # macOS runner: the harness is macOS-centric (SwiftBar/launchd/osascript/iTerm)
    # and the installer tests exercise mac-guarded shell paths.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest pyyaml
      - name: Run test suite
        run: ./bin/run-tests.sh --pytest-only

  bash-suite:
    # Separate job for an independent red/green signal: the bash suite is the
    # regression guard for the security-critical /drive gate machinery and must
    # not be hidden inside the pytest job. macOS for the same mac-centric reason;
    # jq + git are preinstalled on GitHub-hosted runners, and the gate scripts the
    # tests drive are self-contained shell (no Python needed).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run bash test suite
        # Canonical runner: runs ALL test/*.test.sh and reports every failure (no
        # early exit) — the old first-failure loop stopped at the first failing file
        # and masked downstream fails.
        run: ./bin/run-tests.sh --bash-only
